name: Verify IKP time series
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Bootstrap renv
        shell: Rscript {0}
        run: install.packages('renv', repos = 'https://cloud.r-project.org')
      - name: Restore locked runtime packages
        run: Rscript --vanilla R/timeseries/setup.R
      - name: Run checks and regenerate report
        run: Rscript --vanilla R/timeseries/run.R
      - name: Save report and results
        uses: actions/upload-artifact@v4
        with:
          name: timeseries-${{ matrix.os }}
          path: |
            LAPORAN_deret_waktu.md
            output/timeseries/
